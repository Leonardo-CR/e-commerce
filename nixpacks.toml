providers = ["php", "node"]

[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20"]
nixLibs = ["openssl"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist",
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build",
  "php artisan storage:link || true"
]

[start]
cmd = "bash deploy/start.sh"
